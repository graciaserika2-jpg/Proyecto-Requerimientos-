
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos y devoluciones | UPIICSA</title>
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>
    <aside class="sidebar">
        <h2>Préstamo de equipos</h2>
        <nav>
            <a href="/inicio">Inicio</a>
            <a href="/inventario">Inventario</a>
            <a href="/prestamos" class="active">Préstamos y devoluciones</a>
            <a href="/personas">Personas</a>
        </nav>
    </aside>

    <main class="main-content">
        <header>
            <h1>Préstamos y devoluciones</h1>
            <p>Registra préstamos y controla la devolución de equipos.</p>
        </header>

        <section class="card">
            <h2>Registrar préstamo</h2>

            <form id="formPrestamo">
                <label for="personaId">Persona solicitante</label>
                <select id="personaId" name="personaId" required>
                    <option value="">Cargando personas...</option>
                </select>

                <label for="equipoId">Equipo</label>
                <select id="equipoId" name="equipoId" required>
                    <option value="">Cargando equipos...</option>
                </select>

                <label for="fechaDevolucionPrevista">Fecha prevista de devolución</label>
                <input type="date" id="fechaDevolucionPrevista"
                       name="fechaDevolucionPrevista" required>

                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones" name="observaciones"
                          rows="3" maxlength="500"
                          placeholder="Observaciones opcionales"></textarea>

                <button type="submit">Registrar préstamo</button>
                <p id="mensajePrestamo" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="card">
            <h2>Préstamos registrados</h2>

            <label for="filtroPrestamos">Filtrar préstamos</label>
            <select id="filtroPrestamos">
                <option value="Todos">Todos</option>
                <option value="Activo">Activos</option>
                <option value="Devuelto">Devueltos</option>
            </select>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Persona</th>
                            <th>Equipo</th>
                            <th>Fecha de préstamo</th>
                            <th>Devolución prevista</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPrestamos">
                        <tr><td colspan="7">Cargando préstamos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/prestamos.js"></script>
</body>
</html>
