
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Cambiar contraseña | Préstamo de equipos</title>
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>
    <main class="main-content">
        <section class="card">
            <h1>Cambiar contraseña</h1>
            <p>
                Por seguridad, debes cambiar tu contraseña temporal
                antes de continuar.
            </p>

            <form id="formCambiarPassword">
                <label for="passwordActual">Contraseña temporal</label>
                <input
                    id="passwordActual"
                    name="passwordActual"
                    type="password"
                    autocomplete="current-password"
                    required>

                <label for="passwordNueva">Nueva contraseña</label>
                <input
                    id="passwordNueva"
                    name="passwordNueva"
                    type="password"
                    autocomplete="new-password"
                    minlength="12"
                    required>

                <label for="confirmarPassword">Confirmar nueva contraseña</label>
                <input
                    id="confirmarPassword"
                    name="confirmarPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="12"
                    required>

                <button type="submit">Cambiar contraseña</button>
                <p id="mensaje" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="/cambiar-password.js"></script>
</body>
</html>
