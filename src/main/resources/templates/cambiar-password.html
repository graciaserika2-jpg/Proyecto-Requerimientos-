
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña | Préstamo de equipos UPIICSA</title>
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <main class="login-card">
        <h1>Crear nueva contraseña</h1>
        <p class="subtitulo">UPIICSA · Seguridad de tu cuenta</p>

        <p>
            Por seguridad, debes reemplazar tu contraseña temporal
            antes de continuar.
        </p>

        <div id="mensaje" class="mensaje" hidden></div>

        <form id="formCambiarPassword">
            <label for="passwordActual">Contraseña temporal o actual</label>
            <input
                id="passwordActual"
                type="password"
                autocomplete="current-password"
                placeholder="Ingresa tu contraseña actual"
                required
            >

            <label for="passwordNueva">Nueva contraseña</label>
            <input
                id="passwordNueva"
                type="password"
                autocomplete="new-password"
                placeholder="Mínimo 12 caracteres"
                minlength="12"
                required
            >

            <label for="confirmarPassword">Confirmar nueva contraseña</label>
            <input
                id="confirmarPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Repite tu nueva contraseña"
                minlength="12"
                required
            >

            <button id="btnCambiarPassword" type="submit">
                Guardar nueva contraseña
            </button>
        </form>

        <form th:action="@{/logout}" method="post">
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
            >
            <button type="submit" class="btn-secundario">
                Cerrar sesión
            </button>
        </form>
    </main>

    <script src="/cambiar-password.js" defer></script>
</body>
</html>
