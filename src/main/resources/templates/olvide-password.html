
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Recuperar contraseña | Préstamo UPIICSA</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet" href="/login.css">
    <script src="/olvide-password.js" defer></script>
</head>

<body>

    <main class="login-card">

        <h1>Recuperar contraseña</h1>

        <p class="subtitulo">
            Préstamo de equipos · UPIICSA
        </p>

        <p>
            Ingresa el correo electrónico asociado a tu cuenta.
            Si existe una cuenta activa y verificada, recibirás
            un enlace para restablecer tu contraseña.
        </p>

        <form id="formRecuperacion">

            <label for="correo">Correo electrónico</label>

            <input
                id="correo"
                name="correo"
                type="email"
                maxlength="254"
                autocomplete="email"
                placeholder="Ingresa tu correo electrónico"
                required
            >

            <button type="submit" id="btnEnviar">
                Enviar instrucciones
            </button>

        </form>

        <div id="mensaje" class="mensaje" role="status"></div>

        <p>
            <a href="/login">Volver al inicio de sesión</a>
        </p>

    </main>

</body>
</html>
