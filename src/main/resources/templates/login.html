
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Préstamo de equipos UPIICSA</title>
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <main class="login-card">
        <h1>Préstamo de equipos</h1>
        <p class="subtitulo">UPIICSA · Acceso al sistema</p>

        <div th:if="${param.error}" class="mensaje error">
            Usuario o contraseña incorrectos, o cuenta inactiva.
        </div>

        <div th:if="${param.logout}" class="mensaje correcto">
            Cerraste sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <label for="username">Usuario</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="Ingresa tu usuario"
                required
            >

            <label for="password">Contraseña</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Ingresa tu contraseña"
                required
            >

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
            >

            <button type="submit">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
