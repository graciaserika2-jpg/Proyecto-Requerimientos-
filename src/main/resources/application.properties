
spring.application.name=prestamo-equipos

# ==========================================
# BASE DE DATOS MYSQL
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prestamo_equipos}
spring.datasource.username=${DB_USERNAME:prestamo_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En local se mantiene update.
# En el servidor utilizaremos validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Mostrar consultas SQL solamente si se solicita.
spring.jpa.show-sql=${SHOW_SQL:false}

# ==========================================
# CORREO ELECTRONICO - GMAIL SMTP
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# CONFIGURACION DE LA APLICACION
# ==========================================

app.mail.from=${MAIL_USERNAME:}
app.base-url=${APP_BASE_URL:http://localhost:8080}
